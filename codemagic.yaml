workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate Xcode project
        script: |
          flutter create --platforms=ios --project-name carby --org io.arcadiaapps .
          # Fix bundle ID (flutter create sets it to plain 'carby')
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = carby;/PRODUCT_BUNDLE_IDENTIFIER = io.arcadiaapps.carby;/g' \
            ios/Runner.xcodeproj/project.pbxproj
          # Overwrite Podfile — flutter create generates a commented-out platform line
          # mobile_scanner 6.x requires iOS 14.0+
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '14.0'

          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig and running flutter pub get"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!

            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
              end
            end
          end
          PODFILE

      - name: Restore Info.plist permissions
        # flutter create regenerates Info.plist — put back all required usage keys
        script: |
          PLIST=ios/Runner/Info.plist
          add_or_set() {
            /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :$1 '$2'" "$PLIST"
          }
          add_or_set NSCameraUsageDescription        "Carby uses the camera to scan food barcodes."
          add_or_set NSMicrophoneUsageDescription    "Carby benötigt Zugriff auf das Mikrofon, um Lebensmittel per Sprache zu erkennen."
          add_or_set NSSpeechRecognitionUsageDescription "Carby verwendet Spracherkennung, um Lebensmittel schnell zu suchen."
          add_or_set NSPhotoLibraryUsageDescription  "Carby benötigt Zugriff auf die Fotos, um einen Screenshot anzuhängen."

      - name: Install pods
        script: cd ios && pod install && cd ..

      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/v2.0
          include: true
