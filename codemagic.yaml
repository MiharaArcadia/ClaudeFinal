workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate Xcode project
        script: |
          flutter create --platforms=ios --project-name carby --org io.arcadiaapps .
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = carby;/PRODUCT_BUNDLE_IDENTIFIER = io.arcadiaapps.carby;/g' \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Fix Podfile for iOS 14.0
        script: |
          python3 -c "
          import re
          pf = open('ios/Podfile').read()
          pf = re.sub(r'#?\s*platform :ios,.*', \"platform :ios, '14.0'\", pf, count=1)
          if 'IPHONEOS_DEPLOYMENT_TARGET' not in pf:
              pf = pf.replace(
                  'flutter_additional_ios_build_settings(target)',
                  'flutter_additional_ios_build_settings(target)\n        target.build_configurations.each do |config|\n          config.build_settings[\"IPHONEOS_DEPLOYMENT_TARGET\"] = \"14.0\"\n        end'
              )
          open('ios/Podfile', 'w').write(pf)
          print('Podfile patched')
          "

      - name: Restore Info.plist permissions
        script: |
          PLIST=ios/Runner/Info.plist
          add_or_set() {
            /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :$1 '$2'" "$PLIST"
          }
          add_or_set NSCameraUsageDescription "Carby uses the camera to scan food barcodes."
          add_or_set NSMicrophoneUsageDescription "Carby benoetigt Zugriff auf das Mikrofon."
          add_or_set NSSpeechRecognitionUsageDescription "Carby verwendet Spracherkennung."
          add_or_set NSPhotoLibraryUsageDescription "Carby benoetigt Zugriff auf die Fotos."

      - name: Install pods
        script: cd ios && pod install && cd ..

      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/v2.0
          include: true
