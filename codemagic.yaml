workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate Xcode project
        script: |
          flutter create --platforms=ios --project-name carby --org io.arcadiaapps .
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = carby;/PRODUCT_BUNDLE_IDENTIFIER = io.arcadiaapps.carby;/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Install pods
        script: cd ios && pod install && cd ..
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign --no-tree-shake-icons
    artifacts:
      - build/ios/iphoneos/Runner.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/v2.0
          include: true
