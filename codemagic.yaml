workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate Xcode project
        script: |
          flutter create --platforms=ios --project-name carby --org io.arcadiaapps .
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = carby;/PRODUCT_BUNDLE_IDENTIFIER = io.arcadiaapps.carby;/g' \
            ios/Runner.xcodeproj/project.pbxproj
          cp ios/Podfile.ci ios/Podfile

      - name: Generate app icons
        script: |
          SRC="assets/images/icon.png"
          DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$DIR"
          sips -z 40  40  "$SRC" --out "$DIR/Icon-20@2x.png"
          sips -z 60  60  "$SRC" --out "$DIR/Icon-20@3x.png"
          sips -z 58  58  "$SRC" --out "$DIR/Icon-29@2x.png"
          sips -z 87  87  "$SRC" --out "$DIR/Icon-29@3x.png"
          sips -z 80  80  "$SRC" --out "$DIR/Icon-40@2x.png"
          sips -z 120 120 "$SRC" --out "$DIR/Icon-40@3x.png"
          sips -z 120 120 "$SRC" --out "$DIR/Icon-60@2x.png"
          sips -z 180 180 "$SRC" --out "$DIR/Icon-60@3x.png"
          sips -z 1024 1024 "$SRC" --out "$DIR/Icon-1024.png"
          python3 -c "
import json
images=[
  {'idiom':'iphone','scale':'2x','size':'20x20','filename':'Icon-20@2x.png'},
  {'idiom':'iphone','scale':'3x','size':'20x20','filename':'Icon-20@3x.png'},
  {'idiom':'iphone','scale':'2x','size':'29x29','filename':'Icon-29@2x.png'},
  {'idiom':'iphone','scale':'3x','size':'29x29','filename':'Icon-29@3x.png'},
  {'idiom':'iphone','scale':'2x','size':'40x40','filename':'Icon-40@2x.png'},
  {'idiom':'iphone','scale':'3x','size':'40x40','filename':'Icon-40@3x.png'},
  {'idiom':'iphone','scale':'2x','size':'60x60','filename':'Icon-60@2x.png'},
  {'idiom':'iphone','scale':'3x','size':'60x60','filename':'Icon-60@3x.png'},
  {'idiom':'ios-marketing','scale':'1x','size':'1024x1024','filename':'Icon-1024.png'},
]
json.dump({'images':images,'info':{'author':'xcode','version':1}},open('ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json','w'))
"

      - name: Restore Info.plist permissions
        script: |
          PLIST=ios/Runner/Info.plist
          add_or_set() {
            /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :$1 '$2'" "$PLIST"
          }
          add_or_set NSCameraUsageDescription "Carby uses the camera to scan food barcodes."
          add_or_set NSMicrophoneUsageDescription "Carby benoetigt Zugriff auf das Mikrofon."
          add_or_set NSSpeechRecognitionUsageDescription "Carby verwendet Spracherkennung."
          add_or_set NSPhotoLibraryUsageDescription "Carby benoetigt Zugriff auf die Fotos."

      - name: Install pods
        script: cd ios && pod install && cd ..

      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/v2.0
          include: true
