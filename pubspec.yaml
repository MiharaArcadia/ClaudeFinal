name: clocky
description: Freelancer time tracking — kostenlos, werbefrei, offline.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  provider: ^6.1.1

  # Database
  sqflite: ^2.3.2
  path: ^1.9.0

  # PDF export
  pdf: ^3.10.8
  printing: ^5.12.0

  # CSV
  csv: ^6.0.0

  # File system
  path_provider: ^2.1.2

  # Share / email
  share_plus: ^9.0.0

  # UI
  google_fonts: ^6.1.0

  # Utils
  intl: ^0.20.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  permission_handler: ^12.0.3
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/images/
