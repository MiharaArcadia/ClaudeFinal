name: carby
description: A nutrition/calorie tracking app with voice input

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # UI
  fl_chart: ^0.66.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  lottie: ^3.0.0

  # Voice
  speech_to_text: ^7.0.0

  # State
  provider: ^6.1.1

  # Network
  http: ^1.2.0

  # Storage
  shared_preferences: ^2.2.2

  # Utils
  intl: ^0.20.2
  uuid: ^4.2.2
  url_launcher: ^6.2.5
  image_picker: ^1.0.7

  # Desktop (Windows/macOS/Linux)
  window_manager: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 26
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
